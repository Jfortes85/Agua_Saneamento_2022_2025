<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code · Estatísticas oficiais e indicadores de água e saneamento em Cabo Verde</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<style>
  :root{--navy:#0A2540;--sun:#F5A623}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--navy);color:#fff;font-family:'Calibri','Carlito','Segoe UI',system-ui,sans-serif}
  main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .card{max-width:760px;width:100%}
  .kicker{color:var(--sun);letter-spacing:.2em;font-weight:700;font-size:clamp(12px,2vw,16px);text-transform:uppercase}
  h1{font:700 clamp(26px,5vw,46px)/1.15 'Cambria','Caladea',Georgia,serif;margin:.35em 0 .5em}
  #qr{background:#fff;border-radius:18px;padding:clamp(14px,3vw,26px);width:min(82vw,62vh,520px);margin:0 auto}
  #qr svg{display:block;width:100%;height:auto}
  .go{font:700 clamp(18px,3.4vw,30px) 'Calibri','Carlito',sans-serif;margin:.9em 0 .2em}
  .url{color:#A9BCD0;word-break:break-all;font-size:clamp(14px,2.4vw,20px)}
  .url a{color:#8fd3ff}
  .actions{margin-top:18px}
  button{cursor:pointer;background:#1B8FD1;color:#fff;border:0;border-radius:10px;padding:10px 18px;font:700 15px 'Calibri','Carlito',sans-serif;margin:4px}
  @media print{html,body{background:#fff;color:#0A2540}.actions{display:none}.url,.url a{color:#0A2540}.kicker{color:#0A2540}#qr{border:2px solid #0A2540}}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="kicker">Dia Africano da Estatística 2026</div>
    <h1>Estatísticas oficiais e indicadores de água e saneamento em Cabo Verde</h1>
    <div id="qr" role="img" aria-label="QR code que abre a apresentação"></div>
    <p class="go">Aponte a câmara do telemóvel para ver a apresentação</p>
    <p class="url" id="url"></p>
    <p class="actions"><button id="copy" type="button">Copiar ligação</button><button type="button" onclick="print()">Imprimir</button></p>
  </div>
</main>
<script src="assets/js/qrcode.js"></script>
<script>
  // O QR aponta para a própria página da apresentação (a pasta onde está este ficheiro) ou para ?u=<endereço>.
  var p = new URLSearchParams(location.search), u = p.get('u');
  if (!u) { var l = new URL(location.href); l.hash = ''; l.search = ''; u = l.href.replace(/qr\.html$/, ''); }
  var q = qrcode(0, 'M'); q.addData(u); q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  document.getElementById('url').innerHTML = '<a href="' + u.replace(/"/g, '&quot;') + '">' + u.replace(/</g, '&lt;') + '</a>';
  document.getElementById('copy').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(u); this.textContent = 'Copiado ✓'; };
</script>
</body>
</html>
